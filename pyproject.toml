[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "graphmind-agent"
version = "0.1.0"
description = "A domain-neutral knowledge graph construction and grounded QA pipeline"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "neo4j>=5.20,<7",
  "pydantic>=2.6,<3",
  "python-dotenv>=1.0,<2",
  "requests>=2.31,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
kg-qa = "kg_qa_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
